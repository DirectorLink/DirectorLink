    patch:
      tags: [Schedules]
      operationId: updateSchedule
      x-directorlink-role: admin
      summary: Change a schedule
      description: |
        The fields sent replace the schedule's (a whole `trigger` or `only_if`); `{"enabled": false}`
        switches it off. With `version`, the change applies only if nobody changed the schedule
        since (409 `VERSION_CONFLICT`). A changed weather schedule may run again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: The schedule after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
