        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/CommandFailed"

  /v1/logs:
    get:
      tags: [Logs]
      operationId: listLogs
      x-directorlink-role: admin
      summary: Read the bridge's recent log
      description: |
        The bridge keeps its last 500 log entries in memory: API requests, commands sent to
        devices, state changes and errors. Poll with `after` set to the last `seq` you received
        to get only new entries.
      parameters:
        - name: level
          in: query
          description: Minimum level to return.
          schema:
            $ref: "#/components/schemas/LogLevel"
        - name: category
          in: query
          description: Only entries of this category, e.g. `api`, `light`, `thermostat`, `auth`.
          schema:
            type: string
        - name: after
          in: query
          description: Only entries with a sequence number greater than this.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          description: Maximum number of entries (the newest ones are kept).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: Matching entries, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

