      operationId: openDoorbell
      x-directorlink-role: doors
      summary: Open the gate or door wired to the doorbell
      description: |
        Presses the DoorBird's button exactly as the Control4 app does; the button runs the action
        the installer chose (by default *Trigger Relay 1*). Needs **Door Control** = Enabled in
        Composer. Every request is written to the log with the API key used.
      responses:
        "202":
          description: Button pressed. The body is the doorbell as last reported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doorbell"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/CommandFailed"

  /v1/logs:
    get:
      tags: [Logs]
      operationId: listLogs
      x-directorlink-role: admin
      summary: Read the bridge's recent log
      description: |
        The bridge keeps its last 500 log entries in memory: API requests, commands sent to
        devices, state changes and errors. Poll with `after` set to the last `seq` you received
        to get only new entries.
      parameters:
        - name: level
          in: query
          description: Minimum level to return.
          schema:
            $ref: "#/components/schemas/LogLevel"
        - name: category
          in: query
          description: Only entries of this category, e.g. `api`, `light`, `thermostat`, `auth`.
          schema:
            type: string
        - name: after
          in: query
          description: Only entries with a sequence number greater than this.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          description: Maximum number of entries (the newest ones are kept).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: Matching entries, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/logs/settings:
    get:
      tags: [Logs]
      operationId: getLogSettings
      x-directorlink-role: admin
      summary: Get the log level
      responses:
        "200":
          description: The level entries are currently recorded at.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Logs]
      operationId: updateLogSettings
      x-directorlink-role: admin
      summary: Change the log level
      description: Use `debug` while investigating a problem, then set it back to `info`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogSettings"
            example:
              level: debug
      responses:
        "200":
          description: The new settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: "Send `Authorization: Bearer <api key>`. Get a key with `POST /v1/auth/pair`."

  parameters:
    RoomIdQuery:
      name: room_id
      in: query
      description: Only items in this room.
      schema:
        type: integer
        minimum: 1
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}$"
    SceneId:
      name: sceneId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}$"
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LightId:
      name: lightId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DoorbellId:
      name: doorbellId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RelayId:
      name: relayId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CameraId:
      name: cameraId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    BlindId:
      name: blindId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ThermostatId:
      name: thermostatId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}$"
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}$"

  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer

  responses:
    BadRequest:
      description: The request is invalid (`INVALID_REQUEST`, `INVALID_FIELD`, `INVALID_PARAMETER`, `INVALID_JSON`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The API key is missing, wrong or revoked (`UNAUTHORIZED`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist (`NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with what the device supports or with current limits (`NOT_SUPPORTED`, `MODE_NOT_SUPPORTED`, `KEY_LIMIT_REACHED`, `REMOTE_ACCESS_OFF`, `INVITATION_LIMIT_REACHED`, `SCENE_LIMIT_REACHED`, `SCENE_IN_USE`, `SCHEDULE_LIMIT_REACHED`, `VERSION_CONFLICT`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many failed attempts (`PAIRING_RATE_LIMITED`).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CommandFailed:
      description: The controller or device failed the request (`CONTROLLER_COMMAND_FAILED`, `CAMERA_UNREACHABLE`, `CAMERA_LOGIN_FAILED`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Busy:
      description: Too many requests of this kind are waiting (`CAMERA_BUSY`); retry after `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        The API key's role does not allow this (`FORBIDDEN`, with `role` and `required_role`), or
        door control is switched off in Composer (`DOOR_CONTROL_DISABLED`), or a claim token was
        asked for through remote access (`CLAIM_ONLY_ON_HOME_NETWORK`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: The bridge cannot serve this right now (`UNAVAILABLE`), or cannot seal remote requests (`LOCK_UNAVAILABLE`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: brightness must be a whole number from 0 to 100
        code:
          type: string
          description: Stable machine-readable error code.
          example: INVALID_FIELD
        attempts_remaining:
          type: integer
          description: Wrong pairing codes still allowed before pairing locks (`PAIRING_CODE_INVALID`).
        retry_after:
          type: integer
          description: Seconds to wait before trying again, as in the `Retry-After` header (`PAIRING_RATE_LIMITED`).
        errors:
          type: array
          description: Field-level details for validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Health:
      type: object
      required: [status, version, api_version, detail]
      properties:
        status:
          $ref: "#/components/schemas/BridgeStatus"
        version:
          type: string
          example: 0.2.0
        api_version:
          type: string
          example: "1"
        detail:
          type: [string, "null"]
          description: Why the bridge is not `ok`.

    BridgeStatus:
      type: string
      description: "`starting` while the project is being discovered, `ok` when ready, `error` when discovery failed."
      enum: [starting, ok, error]

    System:
      type: object
      required: [bridge, controller, location, inventory, lifecycle]
      properties:
        bridge:
          type: object
          required: [version, api_version, status, detail, started_at]
          properties:
            version:
              type: string
              example: 0.2.0
            api_version:
              type: string
              example: "1"
            status:
              $ref: "#/components/schemas/BridgeStatus"
            detail:
              type: [string, "null"]
            started_at:
              type: string
              format: date-time
        controller:
          type: object
          required: [platform, os_version, model]
          properties:
            platform:
              type: string
              const: control4
            os_version:
              type: [string, "null"]
              example: 3.4.3.727848-res
            model:
              type: [string, "null"]
              example: XDT_CORE1
        location:
          type: object
          required: [city, country_code, country, latitude, longitude, timezone]
          properties:
            city:
              type: [string, "null"]
            country_code:
              type: [string, "null"]
              example: IL
            country:
              type: [string, "null"]
            latitude:
              type: [number, "null"]
              description: For admin keys only, rounded to two decimals; null for other roles.
            longitude:
              type: [number, "null"]
              description: For admin keys only, rounded to two decimals; null for other roles.
            timezone:
              type: [string, "null"]
        inventory:
          type: object
          required: [rooms, devices, supported_devices, lights, thermostats, blinds, cameras, relays, doorbells]
          properties:
            rooms:
              type: integer
            devices:
              type: integer
            supported_devices:
              type: integer
            lights:
              type: integer
            thermostats:
              type: integer
            blinds:
              type: integer
            cameras:
              type: integer
            relays:
              type: integer
            doorbells:
              type: integer
        lifecycle:
          type: object
          description: Driver load history, useful when testing driver updates.
          required: [reload_count, last_init_type, last_init_time, last_destroy_type, last_destroy_time]
          properties:
            reload_count:
              type: integer
            last_init_type:
              type: [string, "null"]
            last_init_time:
              type: [string, "null"]
            last_destroy_type:
              type: [string, "null"]
            last_destroy_time:
              type: [string, "null"]

    PairRequest:
      type: object
      required: [pairing_code]
      additionalProperties: false
      properties:
        pairing_code:
          type: string
          pattern: "^[0-9]{4}[ -]?[0-9]{4}$"
          description: The 8 digits Composer shows, e.g. `1234 5678` (the space or a dash is optional).
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: A name for the new key, e.g. the browser or app using it.
        exchange:
          type: object
          required: [public_key]
          additionalProperties: false
          description: The app's half of an X25519 key exchange; the answer is then sealed.
          properties:
            public_key:
              type: string
              description: The 32-byte X25519 public key, base64.

    NewHomeSecret:
      type: object
      required: [home_id, secret_sha256]
      properties:
        home_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        secret_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 (hex) of the new secret; the secret itself never leaves the controller.

    SealedPairing:
      type: object
      required: [exchange, sealed]
      properties:
        exchange:
          type: object
          required: [public_key]
          properties:
            public_key:
              type: string
              description: The driver's X25519 public key, base64.
        sealed:
          $ref: "#/components/schemas/Envelope"

    Envelope:
      type: object
      description: "A sealed message (docs/ACCOUNTS.md): AES-256-CBC, then HMAC-SHA256 over it."
      required: [v, home, key, iv, ct, mac]
      properties:
        v:
          type: integer
          enum: [1]
        home:
          type: string
        key:
          type: string
        iv:
          type: string
        ct:
          type: string
        mac:
          type: string

    SealedInfo:
      type: object
      required: [home, time, window_seconds]
      properties:
        home:
          type: string
          enum: [lan]
          description: What envelopes on the home network name as their home (not the remote-access home id, which is not given out without a key).
        time:
          type: integer
          description: The controller's clock, seconds since 1970; a request's `ts` must be within `window_seconds` of it.
        window_seconds:
          type: integer

    SealedRequest:
      type: object
      required: [envelope]
      additionalProperties: false
      properties:
        envelope:
          $ref: "#/components/schemas/Envelope"

    SealedAnswer:
      type: object
      required: [envelope]
      properties:
        envelope:
          $ref: "#/components/schemas/Envelope"

    KeyRole:
      type: string
      enum: [viewer, member, doors, admin]
      description: |
        `viewer` reads everything; `member` also controls lights, thermostats and blinds; `doors`
        also opens doors and gates; `admin` also manages API keys, room names and the log.

    ApiKeyUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        role:
          $ref: "#/components/schemas/KeyRole"
        profile_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: Moves the key to another person's profile; an empty profile left behind goes.

    ApiKeyCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/KeyRole"
          description: Default `member`.
        name:
          type: string
          minLength: 1
          maxLength: 64
        profile_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: Another device of an existing person joins their profile; without it the key gets a new profile.

    ApiKey:
      type: object
      required: [id, name, role, created_at, last_used_at, current]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        name:
          type: string
        role:
          $ref: "#/components/schemas/KeyRole"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Last use since the driver started.
        current:
          type: boolean
          description: True for the key that made this request.
        profile_id:
          type: [string, "null"]
          pattern: "^[0-9a-f]{8}$"
          description: The profile (person) the key belongs to.

    NewApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The secret. It is shown only once — store it now.

    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"

    RoomNames:
      type: object
      description: The room's name per language (BCP 47 tag such as `en`, `he`, `pt-BR`), set with `PATCH /v1/rooms/{roomId}`. Empty when none were set; show `name` then.
      additionalProperties:
        type: string
      example:
        en: Living room

    RoomRef:
      type: object
      required: [id, name, names]
      properties:
        id:
          type: integer
        name:
          type: string
          description: The name in the Control4 project.
        names:
          $ref: "#/components/schemas/RoomNames"

    Room:
      type: object
      required: [id, name, names, floor, device_count]
      properties:
        id:
          type: integer
        name:
          type: string
          description: The name in the Control4 project.
        names:
          $ref: "#/components/schemas/RoomNames"
        floor:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: "null"
        device_count:
          type: integer

    RoomUpdate:
      type: object
      required: [names]
      additionalProperties: false
      properties:
        names:
          type: object
          description: Language → name (1–64 characters); an empty string removes that language.
          additionalProperties:
            type: string
            maxLength: 64

    RoomList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Room"

    SceneStep:
      type: object
      required: [type, set]
      additionalProperties: false
      description: |
        One step: devices of one type, and what to set. `device_ids` names the devices (with
        `room_id` as the room they were picked in); without it, every device of the type in
        `room_id`, or in the whole home when `room_id` is null.
      properties:
        type:
          type: string
          enum: [lights, climate, blinds, relays]
        room_id:
          type: [integer, "null"]
          minimum: 1
        device_ids:
          type: [array, "null"]
          minItems: 1
          maxItems: 100
          items:
            type: integer
            minimum: 1
        set:
          description: |
            lights `{"on": true|false}` or `{"brightness": 0-100}` (on/off lights turn on);
            climate any of `mode` (off, heat, cool, auto), `target_temperature` (kept within
            each thermostat's range) and `fan_speed` (low, medium, high, auto, on, circulate; left
            out where a unit does not have it), and with `mode: off` nothing else; blinds
            `{"position": 0-100}`; relays `{"action": "pulse"}`, what their Open button does (a
            door or gate relay is never held closed by a scene).
            climate may carry `heat_setpoint` and/or `cool_setpoint` instead of
            `target_temperature` (cool above heat): dual-setpoint thermostats take them as their
            setpoints (left out where they come closer than the thermostat's deadband);
            single-setpoint thermostats take `heat_setpoint` in heat and `cool_setpoint` in cool.
            On dual-setpoint thermostats `target_temperature` sets the setpoint of the step's mode
            (or of the current mode), and is left out in auto and off.
          type: object
          additionalProperties: false
          properties:
            "on":
              type: boolean
            brightness:
              type: integer
              minimum: 0
              maximum: 100
            mode:
              type: string
              enum: ["off", heat, cool, auto]
            target_temperature:
              type: number
              minimum: 5
              maximum: 40
            heat_setpoint:
              type: number
              minimum: 5
              maximum: 40
            cool_setpoint:
              type: number
              minimum: 5
              maximum: 40
            fan_speed:
              type: string
              enum: [low, medium, high, auto, "on", circulate]
            position:
              type: integer
              minimum: 0
              maximum: 100
            action:
              type: string
              enum: [pulse]

    SceneIcon:
      type: string
      enum: [moon, sun, leave, movie, bulb, climate, blinds, home]

    Scene:
      type: object
      required: [id, name, icon, show_on_home, steps, created_at, updated_at, version]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        name:
          type: string
        icon:
          $ref: "#/components/schemas/SceneIcon"
        show_on_home:
          type: boolean
          description: Shown with a Run button at the top of Home.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/SceneStep"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1

    SceneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Scene"

    SceneCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        icon:
          $ref: "#/components/schemas/SceneIcon"
        show_on_home:
          type: boolean
        steps:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/SceneStep"

    SceneUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        icon:
          $ref: "#/components/schemas/SceneIcon"
        show_on_home:
          type: boolean
        steps:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/SceneStep"
        version:
          type: integer
          minimum: 1

    SceneTry:
      type: object
      required: [steps]
      additionalProperties: false
      properties:
        steps:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/SceneStep"

    SceneRun:
      type: object
      required: [ran, skipped, failed, problems]
      properties:
        scene_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        ran:
          type: integer
          description: Devices whose commands were handed to the controller.
        skipped:
          type: integer
          description: Devices left alone (not allowed for this key, not possible for the device, or gone from the project).
        failed:
          type: integer
          description: Devices whose commands the controller refused.
        problems:
          type: array
          maxItems: 50
          description: What was skipped or failed, and devices that ran with a setting left out (`partial`, counted in `ran`), at most 50.
          items:
            type: object
            required: [step, device_id, outcome, code, detail]
            properties:
              step:
                type: integer
                minimum: 1
                description: The step, counted from 1.
              device_id:
                type: integer
              outcome:
                type: string
                enum: [skipped, failed, partial]
              code:
                type: string
              detail:
                type: string

    ScheduleTrigger:
      description: |
        `time`: `at` ("HH:MM"). `sun`: `event` (sunrise, sunset) and `offset` in minutes (-180 to
        180; negative is before). `weather`: `kind` heat (`above` °C, 15 to 45), wind (`above`
        km/h, 10 to 150) or rain (starts raining), optional hours `from`–`to` ("HH:MM", may cross
        midnight), and `once_a_day` (default true). A weather schedule runs again only after it has
        cooled 2° below the threshold, the wind has dropped 10 km/h below it, or an hour without
        rain.
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [time, sun, weather]
        at:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        event:
          type: string
          enum: [sunrise, sunset]
        offset:
          type: integer
          minimum: -180
          maximum: 180
        kind:
          type: string
          enum: [heat, wind, rain]
        above:
          type: number
        from:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        to:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        once_a_day:
          type: boolean

    ScheduleConditions:
      description: |
        For time and sun schedules: run only if it is not raining, hotter than a temperature, the
        wind is below a speed, or rain is forecast for today (a 50% chance or more). Checked when
        the schedule runs, with the latest weather.
      type: object
      additionalProperties: false
      properties:
        not_raining:
          type: boolean
        hotter_than:
          type: number
          minimum: 15
          maximum: 45
        wind_below:
          type: number
          minimum: 10
          maximum: 150
        rain_expected:
          type: boolean

    ScheduleDays:
      type: array
      minItems: 1
      maxItems: 7
      description: Weekdays, 0 (Sunday) to 6 (Saturday).
      items:
        type: integer
        minimum: 0
        maximum: 6

    Schedule:
      type: object
      required: [id, enabled, scene_id, trigger, days, only_if, if_no_weather, next_run, last_run, version, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        enabled:
          type: boolean
        scene_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        trigger:
          $ref: "#/components/schemas/ScheduleTrigger"
        days:
          $ref: "#/components/schemas/ScheduleDays"
        only_if:
          $ref: "#/components/schemas/ScheduleConditions"
        if_no_weather:
          type: string
          enum: [run, skip]
          description: When `only_if` needs the weather and there is none.
        next_run:
          type: [string, "null"]
          format: date-time
          description: For time and sun schedules that are on.
        last_run:
          type: [object, "null"]
          properties:
            at:
              type: string
              format: date-time
            ran:
              type: [integer, "null"]
            skipped:
              type: [integer, "null"]
            failed:
              type: [integer, "null"]
            note:
              type: [string, "null"]
              description: "`no_weather`: ran without weather data; for weather schedules, the kind that made it run."
            skipped_by:
              type: [string, "null"]
              enum: [only_if, no_weather, null]
              description: It was due but did not run.
            error:
              type: [string, "null"]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScheduleList:
      type: object
      required: [items, paused]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        paused:
          type: boolean
          description: The installer paused all schedules in Composer (DirectorLink's Schedules property); none runs until it is set back to On.

    ScheduleCreate:
      type: object
      required: [scene_id, trigger, days]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        scene_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        trigger:
          $ref: "#/components/schemas/ScheduleTrigger"
        days:
          $ref: "#/components/schemas/ScheduleDays"
        only_if:
          $ref: "#/components/schemas/ScheduleConditions"
        if_no_weather:
          type: string
          enum: [run, skip]

    ScheduleUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        scene_id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        trigger:
          $ref: "#/components/schemas/ScheduleTrigger"
        days:
          $ref: "#/components/schemas/ScheduleDays"
        only_if:
          $ref: "#/components/schemas/ScheduleConditions"
        if_no_weather:
          type: string
          enum: [run, skip]
        version:
          type: integer
          minimum: 1

    Weather:
      type: object
      required: [status, location, fetched_at, current, today, attribution]
      properties:
        status:
          type: string
          enum: [ok, waiting, unreachable, no_location]
          description: "`no_location`: set the latitude and longitude in Composer's project properties."
        detail:
          type: [string, "null"]
        location:
          type: [object, "null"]
          description: For admin keys only (rounded); null for other roles.
          properties:
            latitude:
              type: number
            longitude:
              type: number
        fetched_at:
          type: [string, "null"]
          format: date-time
        current:
          type: [object, "null"]
          properties:
            temperature:
              type: number
              description: °C
            wind_speed:
              type: [number, "null"]
              description: km/h
            wind_gusts:
              type: [number, "null"]
            precipitation:
              type: number
              description: mm
            raining:
              type: boolean
            weather_code:
              type: [integer, "null"]
              description: WMO weather code.
        today:
          type: object
          properties:
            max_temperature:
              type: [number, "null"]
            min_temperature:
              type: [number, "null"]
            rain_chance:
              type: [number, "null"]
              description: Percent.
            sunrise:
              type: [string, "null"]
              description: Local time, "HH:MM".
            sunset:
              type: [string, "null"]
        attribution:
          type: string

    RoomOrder:
      type: object
      required: [room_ids]
      additionalProperties: false
      properties:
        room_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: integer

    ProfilePrefs:
      type: object
      required: [language, theme, palette, favorites, hidden_rooms]
      properties:
        language:
          type: [string, "null"]
          description: '"auto" or a language tag such as "en" or "he".'
        theme:
          type: [string, "null"]
          enum: [auto, light, dark, null]
        palette:
          type: [string, "null"]
          maxLength: 20
        favorites:
          type: array
          maxItems: 200
          items:
            type: string
            pattern: "^[a-z]+:[0-9]+$"
          description: Devices shown first on Home, in order, as "kind:id" (e.g. "light:21").
        hidden_rooms:
          type: array
          maxItems: 1000
          items:
            type: integer
          description: Rooms this person hides from their lists (only for them).

    Profile:
      type: object
      required: [id, name, created_at, version, prefs]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        name:
          type: string
        created_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
          description: Goes up with every change; send it back to detect changes made meanwhile.
        prefs:
          $ref: "#/components/schemas/ProfilePrefs"

    ProfileWithKeys:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [key_ids]
          properties:
            key_ids:
              type: array
              items:
                type: string
                pattern: "^[0-9a-f]{8}$"

    ProfileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProfileWithKeys"

    ProfileUpdate:
      type: object
      required: [prefs]
      additionalProperties: false
      properties:
        prefs:
          type: object
          additionalProperties: false
          properties:
            language:
              type: [string, "null"]
            theme:
              type: [string, "null"]
              enum: [auto, light, dark, null]
            palette:
              type: [string, "null"]
              maxLength: 20
            favorites:
              type: array
              maxItems: 200
              items:
                type: string
                pattern: "^[a-z]+:[0-9]+$"
            hidden_rooms:
              type: array
              maxItems: 1000
              items:
                type: integer
        version:
          type: integer
          minimum: 0

    ProfileRename:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64

    DeviceType:
      type: string
      enum: [light, thermostat, blind, camera, relay, doorbell, other]

    Device:
      type: object
      required: [id, name, type, room, supported, href]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          $ref: "#/components/schemas/DeviceType"
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        supported:
          type: boolean
          description: True when this API can control the device.
        href:
          type: [string, "null"]
          description: Path of the typed resource for supported devices, e.g. `/v1/lights/259`.

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    Light:
      type: object
      required: [id, name, room, "on", brightness, dimmable, brightness_reported]
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        "on":
          type: boolean
        brightness:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: Brightness percent. Null for on/off lights or when unknown.
        dimmable:
          type: boolean
        brightness_reported:
          type: boolean
          description: False when the light does not report its level back (some KNX dimmers).

    LightUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: |
        `{"on": true}` turns the light on at its default level, `{"on": false}` turns it off and
        `{"brightness": 40}` sets the level (dimmable lights only). `"on": false` cannot be
        combined with `brightness`.
      properties:
        "on":
          type: boolean
        brightness:
          type: integer
          minimum: 0
          maximum: 100

    LightList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Light"

    Blind:
      type: object
      required: [id, name, room, position, position_reported]
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        position:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: Percent open — 0 closed, 100 open. Null when the controller does not know it.
        position_reported:
          type: boolean
          description: False when the blind never reports its position.

    BlindUpdate:
      type: object
      required: [position]
      additionalProperties: false
      properties:
        position:
          type: integer
          minimum: 0
          maximum: 100
          description: Target percent open — 0 closed, 100 open.

    Camera:
      type: object
      required: [id, name, room, snapshot_href]
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        snapshot_href:
          type: string
          description: Path of the current picture, e.g. `/v1/cameras/83/snapshot`.

    Relay:
      type: object
      required: [id, name, room, state, state_reported]
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        state:
          oneOf:
            - type: string
              enum: [open, closed]
            - type: "null"
          description: The relay contact (`closed` = energized). Null until the relay reports a change.
        state_reported:
          type: boolean
          description: False when DirectorLink cannot watch this relay's state.

    RelayUpdate:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [open, closed]

    RelayList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Relay"

    Doorbell:
      type: object
      required: [id, name, room, camera, can_open, connected, last_ring_at, last_motion_at, last_opened_at, last_access_at, events]
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        camera:
          description: The doorbell's camera; get pictures from `snapshot_href`.
          oneOf:
            - type: object
              required: [id, snapshot_href]
              properties:
                id:
                  type: integer
                snapshot_href:
                  type: string
            - type: "null"
        can_open:
          type: boolean
          description: True when `POST …/open` can press the doorbell's button.
        connected:
          type: [boolean, "null"]
          description: False after the doorbell driver reported a communication failure; null until the first event.
        last_ring_at:
          type: [string, "null"]
          format: date-time
        last_motion_at:
          type: [string, "null"]
          format: date-time
        last_opened_at:
          type: [string, "null"]
          format: date-time
          description: When the doorbell's relay last opened the gate or door (from anywhere).
        last_access_at:
          type: [string, "null"]
          format: date-time
          description: When access was last granted at the doorbell (keypad).
        events:
          type: array
          description: The last 20 events, newest first, since the driver started.
          items:
            type: object
            required: [type, at]
            properties:
              type:
                type: string
                enum: [doorbell, motion, opened, access, communication_failed]
              at:
                type: string
                format: date-time

    DoorbellList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Doorbell"

    CameraList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Camera"

    BlindList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Blind"

    ThermostatMode:
      type: string
      enum: ["off", heat, cool, auto]

    FanSpeed:
      type: string
      enum: [low, medium, high, auto, "on", circulate]

    Thermostat:
      type: object
      required:
        - id
        - name
        - room
        - online
        - current_temperature
        - target_temperature
        - target_temperature_min
        - target_temperature_max
        - mode
        - modes
        - activity
        - fan_speed
        - fan_speeds
        - setpoints
        - heat_setpoint
        - cool_setpoint
        - setpoint_deadband
      properties:
        id:
          type: integer
        name:
          type: string
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomRef"
            - type: "null"
        online:
          type: boolean
        current_temperature:
          type: [number, "null"]
        target_temperature:
          type: [number, "null"]
          description: Degrees Celsius. On dual-setpoint thermostats, the setpoint of the current mode (null in auto and off).
        target_temperature_min:
          type: number
          description: Applies to `target_temperature`, `heat_setpoint` and `cool_setpoint`. 5 on floor heating set through its heat setpoint.
        target_temperature_max:
          type: number
          description: Applies to `target_temperature`, `heat_setpoint` and `cool_setpoint`.
        mode:
          type: [string, "null"]
          description: Current mode as reported, e.g. `off`, `heat`, `cool`, `auto`.
        modes:
          type: array
          description: Modes that can be set with PATCH.
          items:
            $ref: "#/components/schemas/ThermostatMode"
        activity:
          type: [string, "null"]
          description: What the zone is doing now, e.g. `idle`, `heating`, `cooling`, `fan`.
        fan_speed:
          type: [string, "null"]
        fan_speeds:
          type: array
          description: Fan speeds that can be set with PATCH. Empty when the zone has no fan control.
          items:
            $ref: "#/components/schemas/FanSpeed"
        setpoints:
          type: string
          enum: [single, dual]
          description: |
            `single`: one target temperature. `dual`: separate heat and cool setpoints
            (`heat_setpoint`, `cool_setpoint`); `target_temperature` is then the setpoint the current
            mode uses (heat or cool) and null in auto and off.
        heat_setpoint:
          type: [number, "null"]
          description: Degrees Celsius. Dual-setpoint thermostats; null otherwise.
        cool_setpoint:
          type: [number, "null"]
          description: Degrees Celsius. Dual-setpoint thermostats; null otherwise.
        setpoint_deadband:
          type: [number, "null"]
          description: Degrees Celsius, the smallest gap the thermostat keeps between its heat and cool setpoints. Null when not reported and on single-setpoint thermostats.

    ThermostatUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/ThermostatMode"
        target_temperature:
          type: number
          description: Degrees Celsius, between `target_temperature_min` and `target_temperature_max`.
        fan_speed:
          $ref: "#/components/schemas/FanSpeed"
        heat_setpoint:
          type: number
          description: Degrees Celsius, between `target_temperature_min` and `target_temperature_max`. Dual-setpoint thermostats only (409 `NOT_SUPPORTED` otherwise). The cool setpoint moves up with it when needed to keep `setpoint_deadband`.
        cool_setpoint:
          type: number
          description: Degrees Celsius, as `heat_setpoint`; the heat setpoint moves down with it when needed.

    ThermostatList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Thermostat"

    RemoteAccess:
      type: object
      required: [enabled, connected, lock, home_id]
      properties:
        enabled:
          type: boolean
          description: Remote Access is switched on in Composer.
        connected:
          type: boolean
          description: The controller's connection to api.directorlink.io is up.
        lock:
          type: boolean
          description: This controller passed the lock's self-test and can seal remote requests.
        home_id:
          type: [string, "null"]
          pattern: "^[0-9a-f]{32}$"
          description: This home's id at api.directorlink.io; null while Remote Access is off.

    ClaimToken:
      type: object
      required: [home_id, claim_token, expires_at]
      properties:
        home_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        claim_token:
          type: string
          pattern: "^[0-9a-f]{48}$"
        expires_at:
          type: string
          format: date-time

    InvitationCreate:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/KeyRole"
        expires_in:
          type: integer
          minimum: 60
          maximum: 604800
          description: Seconds until the invitation expires (default 7 days).
        for_me:
          type: boolean
          description: For the admin's own other device; the new key joins the admin's profile.
        email:
          type: string
          maxLength: 254
          description: |
            The address of the person invited. The controller then registers the invitation with
            the account service itself before answering (`registered: true`); without it, the
            home's owner registers it from the app.

    Invitation:
      type: object
      required: [id, role, created_at, expires_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        role:
          $ref: "#/components/schemas/KeyRole"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_by:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: The id of the admin key that made it; revoking or demoting that key revokes the invitation.
        for_me:
          type: boolean
          description: Made with "Add my other device" (the key joins its creator's profile).

    NewInvitation:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [secret, home_id]
          properties:
            secret:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: Shown only here. Share it only inside the invitation link, after `#`.
            home_id:
              type: string
              pattern: "^[0-9a-f]{32}$"
            registered:
              type: boolean
              description: The controller registered it with the account service, for `email`.
            email:
              type: string

    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"

    LogLevel:
      type: string
      enum: [debug, info, warn, error]

    LogEntry:
      type: object
      required: [seq, time, level, category, message, data]
      properties:
        seq:
          type: integer
        time:
          type: string
          format: date-time
        level:
          $ref: "#/components/schemas/LogLevel"
        category:
          type: string
          example: api
        message:
          type: string
        data:
          type: [object, "null"]

    LogList:
      type: object
      required: [items, last_seq, level]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        last_seq:
          type: integer
          description: Highest sequence number recorded so far. Pass it as `after` to poll for new entries.
        level:
          $ref: "#/components/schemas/LogLevel"

    LogSettings:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level:
          $ref: "#/components/schemas/LogLevel"
