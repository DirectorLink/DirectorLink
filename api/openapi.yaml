openapi: 3.1.0
info:
  title: DirectorLink API
  # Stamped from the repository VERSION file at build time.
  version: 0.0.0
  summary: Local REST API for a Control4 home.
  description: |
    **Direct to Director. End-to-end integration. Open source.**

    DirectorLink runs as a driver inside the Control4 controller (Director) and serves this API on
    the home LAN. Resources use logical names — rooms, devices, lights, thermostats, blinds, cameras, relays, doorbells, scenes, schedules, the weather, profiles, invitations. Control4
    command names, proxy IDs and variable numbers never appear in the API.

    **Authentication.** Every operation except health, this API description, pairing and
    `/v1/sealed` (sealed requests, below) needs an API key: `Authorization: Bearer <api key>`. The first key comes from a pairing code: in
    Composer, the **New Pairing Code** action on DirectorLink shows an 8-digit code (`1234 5678`)
    that is valid for 15 minutes and works once (`POST /v1/auth/pair`). An admin key then creates
    more keys under `/v1/api-keys`.

    **Roles.** Every API key has a role, and each role can do everything the ones before it
    can: `viewer` reads everything (including camera pictures), `member` also controls lights,
    thermostats and blinds and runs scenes, `doors` also opens doors and gates, `admin` also
    manages API keys, rooms, scenes, schedules, invitations, profiles, remote access and the log. Each operation lists the least role it needs as `x-directorlink-role`;
    a key without it gets `403 FORBIDDEN`. Opening doors also needs the **Door Control**
    property of DirectorLink in Composer set to Enabled.

    **Changing state.** Send a device's desired state with `PATCH`. The bridge answers
    `202 Accepted` once the command has been handed to the controller. The returned object holds the last state the
    controller reported, so read the resource again to confirm the change.

    **Addresses and browsers.** Requests must be sent to the controller's IP address or a local name
    (e.g. `director.local`); any other `Host` is refused with `421 MISDIRECTED_REQUEST` (this stops
    DNS rebinding). Browsers may call the API only from DirectorLink's own sites.

    **Sealed requests.** The DirectorLink app does not send its key on the home network: it seals
    each request with its device's lock key and sends it to `POST /v1/sealed`, and pairs with a key
    exchange so the new key is never readable on the network (docs/ACCOUNTS.md). Scripts may keep
    using `Authorization: Bearer`.

    **Errors.** All errors use RFC 9457 Problem Details (`application/problem+json`) with a stable,
    machine-readable `code`.

    **Conventions.** JSON properties are snake_case, times are ISO 8601 in UTC, temperatures are
    degrees Celsius, and IDs are the numeric IDs of the Control4 project (treat them as opaque).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://{host}:41999
    description: DirectorLink on the Control4 controller (LAN only).
    variables:
      host:
        default: 192.168.1.10
        description: IP address or local hostname of the Control4 controller.
security:
  - apiKey: []
tags:
  - name: System
    description: Bridge status and controller information.
  - name: Auth
    description: Pairing and API keys.
  - name: Profiles
    description: Each person's preferences (language, theme, palette, favorites), shared by their devices. Every API key belongs to one profile.
  - name: Rooms
    description: Rooms of the Control4 project.
  - name: Schedules
    description: "Scenes run by the controller at a time, at sunrise or sunset, or when the weather turns (Open-Meteo: heat, wind, rain)."
  - name: Scenes
    description: "The home's scenes: one tap sets several lights, thermostats, blinds and gates. Admins make them, members run them."
  - name: Devices
    description: Every device in the project, including ones DirectorLink cannot control yet.
  - name: Lights
    description: Lights DirectorLink can read and control.
  - name: Thermostats
    description: Heating and cooling zones DirectorLink can read and control.
  - name: Blinds
    description: Blinds, shades and shutters DirectorLink can read and control.
  - name: Cameras
    description: Camera snapshots, fetched on the controller so camera logins never leave it.
  - name: Relays
    description: Relays that open doors and gates (KNX Contact/Relay).
  - name: Doorbells
    description: Video doorbells (DoorBird) — rings, motion, access, and opening the gate or door wired to them.
  - name: Logs
    description: The bridge's own recent log, for debugging.
  - name: Remote
    description: |
      Remote access with accounts (docs/ACCOUNTS.md): claiming this home for an account, and
      invitations. Requests that arrive through remote access are sealed end to end and run as the
      device's own key and role.

paths:
  /v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check that the bridge is running
      security: []
      responses:
        "200":
          description: The bridge is reachable. `status` tells whether project discovery finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/openapi.json:
    get:
      tags: [System]
      operationId: getApiDescription
      summary: Get this API description
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document for the running bridge version.
          content:
            application/json:
              schema:
                type: object
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/system:
    get:
      tags: [System]
      operationId: getSystem
      x-directorlink-role: viewer
      summary: Get bridge, controller and project information
      responses:
        "200":
          description: Bridge, controller, location and inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/pair:
    post:
      tags: [Auth]
      operationId: pair
      summary: Exchange a pairing code for an admin API key
      description: |
        Codes are created on demand with the Composer action **New Pairing Code** on DirectorLink
        (and automatically while the driver has no API keys, e.g. right after it is added). Composer
        shows the code as `1234 5678`; send it with or without the space. A code is valid for
        15 minutes and works once; without an active code the answer is `PAIRING_NOT_ACTIVE`.
        Five wrong codes within a minute lock pairing for that device (IP address) for 60 seconds;
        twenty wrong codes in all close the code. Pairing works only on the home network, never as
        a sealed request (`PAIRING_ONLY_ON_HOME_NETWORK`). The key is always `admin`: running
        Composer actions already means full control of the project.

        With `exchange` (the app's X25519 public key), the answer is sealed: it holds the driver's
        public key and the new key sealed with a lock key derived from the shared secret, the code
        and both public keys, so the key never crosses the network in the clear.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
            example:
              pairing_code: "1234 5678"
              name: Chrome on my laptop
      responses:
        "201":
          description: Paired. The response holds the new API key, shown only once, or (with `exchange`) the key sealed for this exchange.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/NewApiKey"
                  - $ref: "#/components/schemas/SealedPairing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The pairing code is wrong (`PAIRING_CODE_INVALID`, with `attempts_remaining`), no code is active — it expired, was used, was closed after too many wrong codes, or none was created (`PAIRING_NOT_ACTIVE`) — or the request was sealed (`PAIRING_ONLY_ON_HOME_NETWORK`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/sealed:
    get:
      tags: [Auth]
      operationId: sealedInfo
      summary: What a sealed request needs from this controller
      description: The controller's clock, for sealing requests on the home network.
      security: []
      responses:
        "200":
          description: The time, and what envelopes name as their home.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealedInfo"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [Auth]
      operationId: sealedRequest
      summary: Send a sealed request on the home network
      description: |
        The request inside the envelope ({ id, ts, method, path, body }) is sealed with the device's
        lock key, derived from its API key; it runs with that key's role, and the answer comes back
        sealed the same way. Each envelope works once, within two minutes of the controller's clock.
        Refused envelopes get a problem with `code` (`UNKNOWN_KEY`, `BAD_MAC`, `BAD_ENVELOPE`,
        `STALE`, `REPLAYED`, `LOCK_UNAVAILABLE`) and the controller's `time`; nothing ran. Envelopes
        name the home `lan`. Only straight from the home network: a sealed request cannot carry
        another one (`BAD_REQUEST`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SealedRequest"
      responses:
        "200":
          description: The answer, sealed (its `status` may be any HTTP status).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealedAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/api-keys:
    get:
      tags: [Auth]
      operationId: listApiKeys
      x-directorlink-role: admin
      summary: List API keys
      responses:
        "200":
          description: All API keys. Secrets are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Auth]
      operationId: createApiKey
      x-directorlink-role: admin
      summary: Create an API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
            example:
              name: Home Assistant
      responses:
        "201":
          description: Created. The response holds the new API key — it is shown only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/api-keys/current:
    get:
      tags: [Auth]
      operationId: getCurrentApiKey
      x-directorlink-role: viewer
      summary: The API key used for this request
      description: Lets an app learn its own role to show only what it may use. The secret is not returned.
      responses:
        "200":
          description: This key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Auth]
      operationId: revokeCurrentApiKey
      x-directorlink-role: viewer
      summary: Revoke the API key used for this request
      description: Lets any client forget itself, whatever its role; later requests with the key get 401.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    patch:
      tags: [Auth]
      operationId: updateApiKey
      x-directorlink-role: admin
      summary: Rename an API key or change its role
      description: The last admin key cannot lose its admin role (`409 LAST_ADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyUpdate"
            example:
              role: member
      responses:
        "200":
          description: The changed key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Auth]
      operationId: deleteApiKey
      x-directorlink-role: admin
      summary: Revoke an API key
      description: Revoking the key used for this request is allowed; later requests with it get 401.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/remote:
    get:
      tags: [Remote]
      operationId: getRemoteAccess
      x-directorlink-role: viewer
      summary: Remote access status
      description: Whether Remote Access is switched on in Composer, connected, and able to seal requests, and this home's id while it is on.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/remote/claim:
    post:
      tags: [Remote]
      operationId: createClaimToken
      x-directorlink-role: admin
      summary: A claim token for linking this home to an account
      description: |
        The app gives the token to the DirectorLink cloud, which checks it with this controller
        over remote access. It works once, for 5 minutes. Only from the home network: holding an
        admin key here is what proves the home is yours.
      responses:
        "201":
          description: A new token (it replaces any earlier one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/remote/secret:
    post:
      tags: [Remote]
      operationId: prepareHomeSecret
      x-directorlink-role: admin
      summary: A new secret for the home's relay connection, for the owner to approve
      description: |
        The controller makes a new secret for its connection to the relay and keeps it next to the
        one in use; the answer holds only its SHA-256. The home's owner gives that to the account
        service (`POST /v1/homes/{home_id}/secret` on api.directorlink.io), which from then on
        accepts only the new secret, and the controller connects with it (docs/RELAY.md). Each
        request gets a new secret; the newest three wait for a day. Only from the home network
        (`SECRET_ONLY_ON_HOME_NETWORK`), so that whoever holds a copy of this controller's data
        cannot replace it.
      responses:
        "200":
          description: The waiting secret's SHA-256.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewHomeSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/invitations:
    get:
      tags: [Remote]
      operationId: listInvitations
      x-directorlink-role: admin
      summary: Pending invitations
      description: Invitations that have not been accepted and have not expired, without their secrets.
      responses:
        "200":
          description: The pending invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Remote]
      operationId: createInvitation
      x-directorlink-role: admin
      summary: Invite someone, or another device of your own
      description: |
        The answer holds the invitation's secret, once. The app puts it after `#` in the link it
        shares, so it never reaches a server; the controller keeps only a key derived from it.
        Whoever accepts gets their own API key with this role. Needs Remote Access switched on.
        With `email`, the controller registers the invitation with the account service first; if
        that fails (`REMOTE_OFFLINE`, or the service's own code with 502) the invitation is
        revoked, since its link could not work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: The invitation, with its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/CommandFailed"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    delete:
      tags: [Remote]
      operationId: revokeInvitation
      x-directorlink-role: admin
      summary: Revoke a pending invitation
      responses:
        "204":
          description: Revoked; the link no longer works.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/profile:
    get:
      tags: [Profiles]
      operationId: getProfile
      x-directorlink-role: viewer
      summary: The caller's profile
      description: The preferences of the person this API key belongs to, shared by all their devices.
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      tags: [Profiles]
      operationId: updateProfile
      x-directorlink-role: viewer
      summary: Change the caller's preferences
      description: |
        Changes the named preferences; `null` clears one, others keep their values. With `version`,
        the change applies only if the profile has not changed since that version was read
        (otherwise 409 `VERSION_CONFLICT`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
            example:
              prefs:
                language: he
                favorites: ["light:21", "thermostat:30"]
              version: 3
      responses:
        "200":
          description: The profile after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      x-directorlink-role: admin
      summary: List profiles
      description: Every profile with the ids of the API keys that belong to it.
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    patch:
      tags: [Profiles]
      operationId: renameProfile
      x-directorlink-role: admin
      summary: Rename a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRename"
      responses:
        "200":
          description: The renamed profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileWithKeys"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/rooms:
    get:
      tags: [Rooms]
      operationId: listRooms
      x-directorlink-role: viewer
      summary: List rooms
      responses:
        "200":
          description: All rooms, in the home's order (PUT /v1/rooms/order); rooms a person hides are in their profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/rooms/order:
    put:
      tags: [Rooms]
      operationId: setRoomOrder
      x-directorlink-role: admin
      summary: Set the home's room order
      description: |
        One order for everyone. Rooms left out follow the listed ones, in Control4's order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomOrder"
            example:
              room_ids: [11, 10]
      responses:
        "200":
          description: All rooms in the new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/rooms/{roomId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [Rooms]
      operationId: getRoom
      x-directorlink-role: viewer
      summary: Get a room
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Rooms]
      operationId: updateRoom
      x-directorlink-role: admin
      summary: Name a room in other languages
      description: |
        Sets the room's name per language (the Control4 name itself does not change). An empty
        string removes a language; languages not in the request keep their names. At most 10
        languages per room. Hiding a room is personal: the profile's `hidden_rooms`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdate"
            example:
              names:
                en: Living room
                he: סלון
      responses:
        "200":
          description: The room with its names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/scenes:
    get:
      tags: [Scenes]
      operationId: listScenes
      x-directorlink-role: viewer
      summary: List scenes
      responses:
        "200":
          description: The home's scenes, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Scenes]
      operationId: createScene
      x-directorlink-role: admin
      summary: Create a scene
      description: |
        At most 50 scenes, each with at most 40 steps. Steps run in order; a step names its devices
        (`device_ids`) or works on every device of its type in a room (`room_id`) or the whole
        home (neither), worked out each time the scene runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneCreate"
            example:
              name: Good night
              icon: moon
              show_on_home: true
              steps:
                - type: lights
                  set: { "on": false }
                - type: climate
                  room_id: 11
                  set: { mode: cool, target_temperature: 24, fan_speed: low }
                - type: lights
                  room_id: 11
                  device_ids: [22]
                  set: { brightness: 10 }
      responses:
        "201":
          description: The new scene.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/scenes/try:
    post:
      tags: [Scenes]
      operationId: trySceneSteps
