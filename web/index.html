<!doctype html>
<html lang="en" dir="ltr" data-palette="graphite" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f4" />
    <meta name="description" content="C4Bridge — control your Control4 home over your own network." />
    <meta name="color-scheme" content="light dark" />
    <!-- Saved palette, theme and text direction, before the first paint. -->
    <script src="/theme-boot.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
    <title>C4Bridge</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app">
      <nav id="tabbar" class="tabbar" aria-label="Main">
        <a class="tab" href="#/" data-tab="home"><span class="tab-label">Home</span></a>
        <a class="tab" href="#/cameras" data-tab="cameras"><span class="tab-label">Cameras</span></a>
        <a class="tab" href="#/climate" data-tab="climate"><span class="tab-label">Climate</span></a>
        <a class="tab" href="#/settings" data-tab="settings"><span class="tab-label">Settings</span></a>
      </nav>
      <main id="main" class="main" tabindex="-1">
        <div id="view" class="view">
          <div class="boot" role="status">
            <img src="/icons/icon.svg" alt="" width="56" height="56" />
            <p>C4Bridge</p>
          </div>
          <noscript>
            <p class="notice notice-error">C4Bridge needs JavaScript. <a href="/console.html">API console</a></p>
          </noscript>
        </div>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
