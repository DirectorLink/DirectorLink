name: Publish C4Bridge Release

on:
  push:
    branches: ["main"]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python tools
        run: pip install -r requirements-dev.txt

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be MAJOR.MINOR.PATCH, got: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run driver tests
        run: lua5.1 driver/tests/run.lua

      - name: Check API spec against the driver
        run: python scripts/check_api.py

      - name: Build driver
        run: python scripts/build.py

      - name: Validate package
        run: python scripts/check_package.py

      - name: Check live responses against the API spec
        run: python scripts/check_contract.py

      - name: Create checksums
        shell: bash
        run: (cd dist && sha256sum C4Bridge.c4z openapi.json) > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NOTES="docs/releases/$TAG.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace an immutable release."
            exit 1
          fi

          ARGS=(
            "$TAG"
            "dist/C4Bridge.c4z"
            "dist/openapi.json"
            "SHA256SUMS.txt"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "C4Bridge $TAG"
          )

          if [[ -f "$NOTES" ]]; then
            ARGS+=(--notes-file "$NOTES")
          else
            ARGS+=(--generate-notes)
          fi

          gh release create "${ARGS[@]}"
