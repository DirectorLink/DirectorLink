name: Publish C4Bridge Release

on:
  push:
    branches: ["main"]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify driver source version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          grep -F "Version.BRIDGE_VERSION = \"$VERSION\"" driver/src/core/version.lua

      - name: Build driver
        run: python scripts/build.py

      - name: Validate package
        run: python scripts/check_package.py

      - name: Create checksum
        shell: bash
        run: sha256sum dist/C4Bridge.c4z > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="docs/releases/$TAG.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace an immutable release."
            exit 1
          fi

          ARGS=(
            "$TAG"
            "dist/C4Bridge.c4z"
            "SHA256SUMS.txt"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "C4Bridge $TAG"
          )

          if [[ -f "$NOTES" ]]; then
            ARGS+=(--notes-file "$NOTES")
          else
            ARGS+=(--generate-notes)
          fi

          if [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${ARGS[@]}"
