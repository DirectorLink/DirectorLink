name: Validate DirectorLink

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:

permissions:
  contents: read

# The work runs in parallel jobs (about 3 to 4 minutes). "changes" first says whether anything
# but the website and the docs changed: if not, the driver, time-zone, app and cloud tests are
# skipped and only "checks" runs (about 2 to 3 minutes). A push to main always runs everything: a
# release starts only once Validate has passed on its commit (release.yml, ADR-075). The last
# job, "validate", passes only when every job passed, or was skipped because nothing it tests
# changed: it is the one check to require. Lua 5.1 comes from lua.org, checked and built by
# scripts/install_lua.sh and cached, not from Ubuntu's package mirror (one hung for 25 minutes).
jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.decide.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # A pull request is checked out as its merge commit: its first parent is the base branch it
      # is merged with, so the difference is exactly what the pull request changes. A push to a
      # dev/ branch is compared with main as it is now (what main has and the branch lacks counts
      # as changed too, so that errs towards running the tests). Only the paths below skip the
      # tests; any other path, or anything that cannot be compared, runs everything. --no-renames
      # lists both names of a moved file.
      - name: Decide whether the tests run
        id: decide
        timeout-minutes: 3
        env:
          WEBSITE_AND_DOCS: '^(docs/|site/|github-link/|README\.md$|SECURITY\.md$|NOTICE$|LICENSE$)'
        run: |
          decide() {
            echo "tests=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            decide true "A push to main: everything runs."
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git rev-parse --verify --quiet "HEAD^2" > /dev/null || decide true "Not a merge commit: everything runs."
            base="HEAD^1"
          else
            git fetch --quiet --no-tags --depth=1 origin main || decide true "Could not fetch main: everything runs."
            base="FETCH_HEAD"
          fi
          changed="$(git diff --no-renames --name-only "$base" HEAD)" || decide true "Could not compare: everything runs."
          [ -n "$changed" ] || decide true "No file changed: everything runs."
          echo "Changed:"
          echo "$changed"
          if grep -qvE "$WEBSITE_AND_DOCS" <<< "$changed"; then
            decide true "Not only the website and the docs changed: everything runs."
          fi
          decide false "Only the website and the docs changed: the driver, time-zone, app and cloud tests are skipped."

  driver-tests:
    name: Driver tests (part ${{ matrix.part }} of 6)
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Lua 5.1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ~/.lua-5.1.5
          key: lua-5.1.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_lua.sh') }}

      - name: Install Lua 5.1
        timeout-minutes: 5
        run: bash scripts/install_lua.sh

      # driver/tests/run.lua splits the suites into six parts of about equal time (by the times
      # it lists); every suite is in exactly one part. The first line of the output names them.
      - name: Run driver tests
        run: lua5.1 driver/tests/run.lua --shard ${{ matrix.part }}/6

  time-zones:
    name: Calendar and schedule tests in other time zones
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Lua 5.1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ~/.lua-5.1.5
          key: lua-5.1.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_lua.sh') }}

      - name: Install Lua 5.1
        timeout-minutes: 5
        run: bash scripts/install_lua.sh

      # Shabbat times are moments, schedules minutes of the local day: again where the clocks
      # change on a Friday (Israel) and where they change on another day (the US).
      - name: Run the calendar and schedule tests in Israel's and New York's time zones
        run: |
          TZ=Asia/Jerusalem lua5.1 driver/tests/run.lua test_calendar test_schedules test_holy_times
          TZ=America/New_York lua5.1 driver/tests/run.lua test_calendar test_schedules test_holy_times

  # Always: the website, the docs' links and the package are checked here.
  checks:
    name: Build and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        timeout-minutes: 5
        with:
          python-version: "3.x"

      - name: Install Python tools
        timeout-minutes: 5
        run: pip install -r requirements-dev.txt

      - name: Cache Lua 5.1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ~/.lua-5.1.5
          key: lua-5.1.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_lua.sh') }}

      - name: Install Lua 5.1
        timeout-minutes: 5
        run: bash scripts/install_lua.sh

      - name: Check Lua syntax
        run: find driver -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Test the build and check scripts
        run: python -m unittest discover -s tests/scripts

      # scripts/verify_live.mjs against fake sites and a Git repository made for the test (ADR-075).
      - name: Test the check of the live sites
        run: node --test tests/scripts/*.test.mjs

      # The website's own tests (also in the app tests), here too: a change to the website alone
      # skips the app and cloud tests.
      - name: Test the website's script
        run: node --test tests/app/site-*.test.mjs

      - name: Check that no local configuration or secrets are committed
        run: python scripts/check_repo.py

      - name: Check API spec against the driver
        run: python scripts/check_api.py

      - name: Build driver
        run: python scripts/build.py

      - name: Validate package
        run: python scripts/check_package.py

      - name: Show package checksums
        run: (cd dist && sha256sum DirectorLink.c4z openapi.json)

      - name: Check live responses against the API spec
        run: python scripts/check_contract.py

      - name: Validate app
        run: python scripts/check_app.py

      - name: Validate console and website
        run: python scripts/check_sites.py

      - name: Check JavaScript syntax (app, console, website and relay)
        run: find app console site cloud github-link -name '*.js' -print0 | xargs -0 -n1 node --check

  app-and-cloud:
    name: App and cloud tests
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: "22"

      # The app's CPace test runs the driver's Lua code too (driver/tests/cpace_cli.lua), and
      # skips that part without Lua.
      - name: Cache Lua 5.1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ~/.lua-5.1.5
          key: lua-5.1.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_lua.sh') }}

      - name: Install Lua 5.1
        timeout-minutes: 5
        run: bash scripts/install_lua.sh

      - name: Run app tests (offline service worker)
        run: node --test tests/app/*.test.mjs

      # The cloud Worker end to end under `wrangler dev --local` (tests/cloud/worker.mjs), with fake
      # Google, Apple and controllers, all on this machine; no secrets. npx fetches the pinned
      # wrangler once, before the test files start their Workers side by side.
      - name: Fetch wrangler for the cloud tests
        timeout-minutes: 5
        run: npx --yes wrangler@4.143.0 --version

      - name: Run cloud tests
        timeout-minutes: 20
        run: node --test tests/cloud/*.test.mjs

  # Fails unless "changes" and "checks" passed, and the tests passed, or were skipped because
  # "changes" found only the website and the docs changed (never on a push to main). A job that
  # failed or was cancelled fails it too; a check that is merely skipped would count as passed.
  validate:
    if: always()
    needs: [changes, driver-tests, time-zones, checks, app-and-cloud]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was skipped because nothing it tests changed
        env:
          NEEDS: ${{ toJSON(needs) }}
          DECISION: ${{ needs.changes.outputs.tests }}
          RUN_TESTS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.tests == 'true' }}
          ALWAYS: changes=${{ needs.changes.result }} checks=${{ needs.checks.result }}
          TESTS: driver-tests=${{ needs.driver-tests.result }} time-zones=${{ needs.time-zones.result }} app-and-cloud=${{ needs.app-and-cloud.result }}
        run: |
          echo "$NEEDS"
          failed=0
          if [ "$DECISION" != "true" ] && [ "$DECISION" != "false" ]; then
            echo "::error::\"changes\" did not say whether the tests run (\"$DECISION\")."
            failed=1
          fi
          if [ "$RUN_TESTS" = "true" ]; then expected="success"; else expected="skipped"; fi
          for job in $ALWAYS; do
            [ "${job#*=}" = "success" ] || { echo "::error::${job%%=*}: ${job#*=}"; failed=1; }
          done
          for job in $TESTS; do
            [ "${job#*=}" = "$expected" ] || { echo "::error::${job%%=*}: ${job#*=}, expected $expected"; failed=1; }
          done
          exit "$failed"
