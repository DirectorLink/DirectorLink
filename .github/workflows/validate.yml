name: Validate DirectorLink

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install Python tools
        run: pip install -r requirements-dev.txt

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Check Lua syntax
        run: find driver -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Run driver tests
        run: lua5.1 driver/tests/run.lua

      - name: Check that no local configuration or secrets are committed
        run: python scripts/check_repo.py

      - name: Check API spec against the driver
        run: python scripts/check_api.py

      - name: Build driver
        run: python scripts/build.py

      - name: Validate package
        run: python scripts/check_package.py

      - name: Show package checksums
        run: (cd dist && sha256sum DirectorLink.c4z openapi.json)

      - name: Check live responses against the API spec
        run: python scripts/check_contract.py

      - name: Validate app
        run: python scripts/check_app.py

      - name: Validate console and website
        run: python scripts/check_sites.py

      - name: Check JavaScript syntax (app, console and relay)
        run: find app console cloud -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run app tests (offline service worker)
        run: node --test tests/app/*.test.mjs
